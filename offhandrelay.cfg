# OffHandRelay config. Changes apply within a second, no SteamVR restart needed.
# Easiest way to edit: OffHandRelay Config.exe in this folder.
#
# Format (one rule per line):
#   <source hand> <source button path> -> <target hand> <target button path> [hold|toggle] [suppress|keep]
#
#   hold      target is pressed only while the source is held
#   toggle    press source once = target held down, press again = released
#   suppress  the source button no longer does anything on its own hand
#   keep      the source button still works normally on its own hand too
#
# The target's /click, /touch and /value are all driven together, so games that
# read the analog value (e.g. trigger pull) see a full press.
#
# Stick relay (one stick acts as the other):
#   stick <hand> <stick path> -> <hand> <stick path> [while|unless <hand> <button path>] [suppress|keep]
#   while ...  only while that button is held; the button itself is hidden from games
#              unless you add keep_button
#   unless ... always, EXCEPT while that button is held
#
# Layer: add "while <hand> <button path>" to a button rule to make it apply only
# to presses made while that button is held (see the d-pad layer at the bottom).
#   suppress   the source stick reads as centered while relaying
#
# Button paths: with log_presses on, press buttons and look in SteamVR's log
# (Settings > Developer > Web Console, or Steam\logs\vrserver.txt) for lines like
#   [OffHandRelay] right /input/grip/click PRESSED
# then copy the path into a rule. Turn logging off once everything works.

log_presses true

# Steam Frame controller button names:
#   right: a b x y menu system thumbstick grip bumper trigger thumbrest
#   left:  dpad_up/down/left/right view system thumbstick grip bumper trigger thumbrest
# Each is /input/<name>/click, e.g. /input/bumper/click.

# Right X -> left bumper (the grab button in most games), held while you hold X.
right /input/x/click -> left /input/bumper/click hold suppress

# Right Y -> left trigger, held while you hold Y
right /input/y/click -> left /input/trigger/click hold suppress

# The right stick works normally, but while you hold the right bumper it acts as the
# left stick. The bumper still does its own job in the game (keep_button).
stick right /input/thumbstick -> left /input/thumbstick while right /input/bumper/click suppress keep_button

# D-pad layer: while you hold the right bumper, Y, X, B, A press the left
# d-pad up, left, right, down (instead of their usual jobs). The bumper itself
# keeps working normally.
right /input/y/click -> left /input/dpad_up/click hold suppress while right /input/bumper/click
right /input/x/click -> left /input/dpad_left/click hold suppress while right /input/bumper/click
right /input/b/click -> left /input/dpad_right/click hold suppress while right /input/bumper/click
right /input/a/click -> left /input/dpad_down/click hold suppress while right /input/bumper/click

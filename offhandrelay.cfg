# OffHandRelay config - restart SteamVR after editing.
#
# Format (one rule per line):
#   <source hand> <source button path> -> <target hand> <target button path> [hold|toggle] [suppress|keep]
#
#   hold      target is pressed only while the source is held
#   toggle    press source once = target held down, press again = released
#   suppress  the source button no longer does anything on its own hand
#   keep      the source button still works normally on its own hand too
#
# The target's /click, /touch and /value are all driven together, so games that
# read the analog value (e.g. trigger pull) see a full press.
#
# Button paths: with log_presses on, press buttons and look in SteamVR's log
# (Settings > Developer > Web Console, or Steam\logs\vrserver.txt) for lines like
#   [OffHandRelay] right /input/grip/click PRESSED
# then copy the path into a rule. Turn logging off once everything works.

log_presses true

# Steam Frame controller button names:
#   right: a b x y menu system thumbstick grip bumper trigger thumbrest
#   left:  dpad_up/down/left/right view system thumbstick grip bumper trigger thumbrest
# Each is /input/<name>/click, e.g. /input/bumper/click.

# Right X -> left bumper (the grab button in most games), held while you hold X
right /input/x/click -> left /input/bumper/click hold suppress

# Right Y -> left trigger, held while you hold Y
right /input/y/click -> left /input/trigger/click hold suppress
